name: whiteboard_canvas
description: Whiteboard shared canvas — engine-agnostic canvas widgets, painters and context editors used by desktop and web apps.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  whiteboard_icons:
    path: ../icons
  whiteboard_theme:
    path: ../theme
  whiteboard_ui_kit:
    path: ../ui_kit
  whiteboard_core:
    path: ../core_dart
  provider: ^6.1.0
  # SVG 解码 / 光栅化（「我的组件」导入，渲染统一为 ui.Image）。
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
