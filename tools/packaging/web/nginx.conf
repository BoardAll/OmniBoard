# ============================================================================
# nginx.conf — Whiteboard Web server configuration.
# ============================================================================
# Implements docs/构建打包与发布设计.md §14.3 (§14.2 for the container usage).
#
# Usages:
#   * Container (tools/packaging/web/Dockerfile):
#       mounted as /etc/nginx/conf.d/default.conf with the bundle at
#       /usr/share/nginx/html.
#   * Bare server (docs §14.3):
#       deploy the static bundle to /var/www/whiteboard, point `root` below at
#       it, and switch listen to the `443 ssl http2` + ssl_certificate variant
#       if TLS terminates here.
#
# Highlights:
#   * COOP/COEP headers: required for WebAssembly + SharedArrayBuffer.
#     nginx does NOT inherit add_header into a location block that declares any
#     add_header of its own, so the two isolation headers are repeated in each
#     location (do not remove them there).
#   * application/wasm MIME type + immutable caching for hashed assets.
#   * SPA fallback (try_files ... /index.html).
#   * /api and /ws reverse proxies — replace the example upstream host
#     (api.whiteboard.example.com) with the real backend.
# ============================================================================
server {
  listen 80;
  server_name whiteboard.example.com;

  root /usr/share/nginx/html;
  index index.html;

  # Cross-origin isolation (WASM/SharedArrayBuffer), docs §14.3.
  add_header Cross-Origin-Opener-Policy same-origin;
  add_header Cross-Origin-Embedder-Policy require-corp;
  add_header X-Content-Type-Options nosniff;

  # Compiled WebAssembly core (wb_core.wasm) — immutable, correct MIME.
  location ~* \.wasm$ {
    types { application/wasm wasm; }
    # Repeated: add_header is not inherited into this block (see header note).
    add_header Cross-Origin-Opener-Policy same-origin;
    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Hashed JS/CSS chunks — immutable.
  location ~* \.(js|css)$ {
    add_header Cross-Origin-Opener-Policy same-origin;
    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Entry point — never cached (it references hashed assets + app version).
  location = /index.html {
    add_header Cross-Origin-Opener-Policy same-origin;
    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "no-cache";
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST API — replace with the real API host (docs §14.3).
  location /api/ {
    proxy_pass https://api.whiteboard.example.com/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # WebSocket endpoint — upgrade headers required (docs §14.3).
  location /ws {
    proxy_pass https://api.whiteboard.example.com/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
