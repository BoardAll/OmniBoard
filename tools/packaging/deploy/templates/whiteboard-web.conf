# ============================================================================
# whiteboard-web.conf — Whiteboard Web 静态站（nginx 站点配置）
# ============================================================================
# 由 tools/packaging/deploy/install.sh 安装到：
#   /etc/nginx/sites-available/whiteboard.conf
#   → 软链到 /etc/nginx/sites-enabled/whiteboard.conf
# 占位符：__WB_APP_DIR__（安装目录，默认 /opt/whiteboard）
#
# 设计说明：
#   * 不启用 COOP/COEP：当前 wb_core.wasm 无 pthread（不需要 SharedArrayBuffer），
#     而 Web 端 socket.io 客户端 JS 从 http://<server>:8790 跨源动态加载，
#     若启用 COEP require-corp 会被浏览器拦截。未来若引入 pthread/SAB 需
#     重新评估（届时应改为同源反代 socket.io，见文末注释块）。
#   * realtime 默认直连 8790（Web 构建时已注入 WB_REALTIME_ENDPOINT）；
#     如需改为同源反代，放开文末注释块，并把 Web 构建地址指向本端口。
#   * 不做长缓存 immutable：产物文件名多为固定名（main.dart.js / wb_core.*），
#     更新部署需即时生效；后续有 hash 资源优化需求再单独配置。
# ============================================================================
server {
  # 直连 IP 部署：作为 80 端口的默认站。
  # （IPv6 行按需放开——IPv6 被禁用的系统上 listen [::]:80 会导致 nginx 启动失败）
  listen 80 default_server;
  # listen [::]:80 default_server;
  server_name _;

  root __WB_APP_DIR__/web;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/wasm;

  # WASM 核心（wb_core.wasm）——显式 MIME，兼容旧版 nginx 的 mime.types
  location ~* \.wasm$ {
    types { application/wasm wasm; }
    try_files $uri =404;
  }

  # 入口不缓存（引用固定文件名产物，更新后需重新拉取）
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA 回退
  location / {
    try_files $uri $uri/ /index.html;
  }

  # —— 备选：Socket.IO 同源反代（默认不用；同源方案时放开并同步改 Web 构建地址） ——
  # location /socket.io/ {
  #   proxy_pass http://127.0.0.1:8790;
  #   proxy_http_version 1.1;
  #   proxy_set_header Upgrade $http_upgrade;
  #   proxy_set_header Connection "upgrade";
  #   proxy_set_header Host $host;
  # }
}
