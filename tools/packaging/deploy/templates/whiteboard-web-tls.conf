# ============================================================================
# whiteboard-web-tls.conf — Whiteboard Web 静态站（HTTPS 同源，TLS 终止在 nginx）
# ============================================================================
# 由 tools/packaging/deploy/install.sh --tls-domain 渲染安装到：
#   /etc/nginx/sites-available/whiteboard.conf
#   → 软链到 /etc/nginx/sites-enabled/whiteboard.conf
# 占位符：__WB_APP_DIR__ / __WB_DOMAIN__ / __WB_CERT__ / __WB_KEY__ / __WB_PORT__
#
# 为什么必须 HTTPS（不只是「更安全」）：
#   * 投屏采集走 navigator.mediaDevices.getDisplayMedia()，浏览器只在安全上下文
#     （HTTPS / localhost / 127.0.0.1）才暴露 mediaDevices。纯 HTTP + IP 访问时
#     mediaDevices 是 undefined，页面会报
#     "Unable to getDisplayMedia: Null check operator used on a null value"。
#   * 摄像头采集 getUserMedia 同理。
#
# 同源设计：
#   * 页面与 /socket.io/ 都在本 server 块下；Web 构建注入的
#     WB_REALTIME_ENDPOINT=https://<域名> 不带端口，也不会出现
#     「HTTPS 页面连 HTTP 信令」的混合内容拦截。
#   * realtime 仍只监听 127.0.0.1:__WB_PORT__，不对公网暴露端口。
# ============================================================================

# —— 80：ACME 续期挑战 + 其余请求 301 到 HTTPS ——
server {
  listen 80 default_server;
  # listen [::]:80 default_server;
  server_name __WB_DOMAIN__;

  # certbot --webroot -w /var/www/certbot 续期用
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# —— 443：静态站 + Socket.IO 同源反代 ——
server {
  listen 443 ssl default_server;
  # listen [::]:443 ssl default_server;
  server_name __WB_DOMAIN__;

  ssl_certificate     __WB_CERT__;
  ssl_certificate_key __WB_KEY__;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1h;

  root __WB_APP_DIR__/web;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/wasm;

  # WASM 核心（wb_core.wasm）——显式 MIME，兼容旧版 nginx 的 mime.types
  location ~* \.wasm$ {
    types { application/wasm wasm; }
    try_files $uri =404;
  }

  # 入口不缓存（引用固定文件名产物，更新后需重新拉取）
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Socket.IO 信令：WebSocket upgrade + 客户端脚本
  # （GET /socket.io/socket.io.min.js 也由 realtime 提供，无需单独配置）
  location /socket.io/ {
    proxy_pass http://127.0.0.1:__WB_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 长连接：投屏信令空闲时间可能较长，避免代理提前断开
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA 回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
