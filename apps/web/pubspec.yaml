name: whiteboard_web
description: Whiteboard Web App
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  whiteboard_ui:
    path: ../../packages/ui
  whiteboard_ui_kit:
    path: ../../packages/ui_kit
  whiteboard_theme:
    path: ../../packages/theme
  whiteboard_icons:
    path: ../../packages/icons
  whiteboard_core:
    path: ../../packages/core_dart
  whiteboard_canvas:
    path: ../../packages/canvas
  whiteboard_api_client:
    path: ../../packages/api_client
  whiteboard_web_platform:
    path: ../../platform/web
  # 局域网投屏（四位码即房间号；信令复用 realtime /cast，媒体 WebRTC P2P）。
  whiteboard_cast:
    path: ../../packages/cast
  go_router: ^14.0.0
  provider: ^6.1.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
