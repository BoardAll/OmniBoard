name: whiteboard_desktop
description: Whiteboard Desktop App
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  whiteboard_ui:
    path: ../../packages/ui
  whiteboard_ui_kit:
    path: ../../packages/ui_kit
  whiteboard_theme:
    path: ../../packages/theme
  whiteboard_icons:
    path: ../../packages/icons
  whiteboard_core:
    path: ../../packages/core_dart
  whiteboard_ai:
    path: ../../packages/ai_dart
  whiteboard_api_client:
    path: ../../packages/api_client
  whiteboard_mcp_client:
    path: ../../packages/mcp_client
  whiteboard_windows:
    path: ../../platform/windows
  provider: ^6.1.0
  riverpod: ^2.5.0
  go_router: ^14.0.0
  window_manager: ^0.4.0
  hotkey_manager: ^0.2.0
  tray_manager: ^0.3.0
  screen_retriever: ^0.1.0
  flutter_miuix: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/templates/
